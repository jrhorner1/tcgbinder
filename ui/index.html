<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>TCG Binder</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-cards" viewBox="0 0 24 24"><rect x="3" y="3" width="13" height="17" rx="2"/><path d="M8 21h11a2 2 0 0 0 2-2V7"/></symbol>
    <symbol id="i-add" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-tools" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></symbol>
    <symbol id="i-scan" viewBox="0 0 24 24"><path d="M3 8a1 1 0 0 1 1-1h3l2-3h6l2 3h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><circle cx="12" cy="13" r="3.5"/></symbol>
  </defs>
</svg>
<div class="shell">
  <aside class="sidebar">
    <a class="brand" href="#/home"><img src="icon.png" alt=""><span>TCG Binder</span></a>
    <select id="game" aria-label="Game" hidden></select>
    <nav id="nav" aria-label="Main">
      <a href="#/home" data-view="home"><svg class="ico" aria-hidden="true"><use href="#i-home"/></svg>Home</a>
      <a href="#/collection" data-view="collection"><svg class="ico" aria-hidden="true"><use href="#i-cards"/></svg><span class="game-name">Collection</span></a>
      <a href="#/tools" data-view="tools"><svg class="ico" aria-hidden="true"><use href="#i-tools"/></svg>Tools</a>
      <a href="#/settings" data-view="settings"><svg class="ico" aria-hidden="true"><use href="#i-settings"/></svg>Settings</a>
    </nav>
    <div class="side-actions">
      <a class="button primary" href="#/add"><svg class="ico" aria-hidden="true"><use href="#i-add"/></svg>Add cards</a>
      <a class="button" href="#/scan" data-scan hidden><svg class="ico" aria-hidden="true"><use href="#i-scan"/></svg>Scan a card</a>
    </div>
    <p class="side-foot muted" id="version"></p>
  </aside>
  <div class="content">
    <header class="topbar">
      <a class="brand phone-only" href="#/home"><img src="icon.png" alt=""><span>TCG Binder</span></a>
      <form id="globalsearch" role="search"><input type="search" id="gsq" placeholder="Search all cards" aria-label="Search all cards"></form>
    </header>
    <main id="main"><p class="muted">Loading…</p></main>
    <footer id="status" role="status" aria-live="polite"></footer>
  </div>
  <nav class="tabbar" aria-label="Main">
    <a href="#/home" data-view="home"><svg class="ico" aria-hidden="true"><use href="#i-home"/></svg>Home</a>
    <a href="#/collection" data-view="collection"><svg class="ico" aria-hidden="true"><use href="#i-cards"/></svg>Cards</a>
    <a href="#/add" data-view="add"><svg class="ico" aria-hidden="true"><use href="#i-add"/></svg>Add</a>
    <a href="#/tools" data-view="tools"><svg class="ico" aria-hidden="true"><use href="#i-tools"/></svg>Tools</a>
    <a href="#/settings" data-view="settings"><svg class="ico" aria-hidden="true"><use href="#i-settings"/></svg>Settings</a>
  </nav>
</div>
<dialog id="dialog"></dialog>
<script src="app.js"></script>
</body>
</html>
