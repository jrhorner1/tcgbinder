# Builds TCG Binder for macOS (universal), Windows (x86-64) and Linux (x86-64, ARM64)
# with Tauri and publishes a GitHub release with the installers and their SHA-256
# checksums.
#
# Release: push a version tag, e.g.  git tag -s v0.2.0 -m "TCG Binder 0.2.0" && git push origin v0.2.0
# Try the builds without releasing: Actions → Release → Run workflow (artifacts only).
#
# The iPhone app isn't built here: it needs your Apple signing certificate (see the
# README's iPhone section).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp on a test build (no release is published)"
        required: true
        default: "0.0.0-dev"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-universal, os: macos-latest, args: "--target universal-apple-darwin", rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
          - { name: windows-x64, os: windows-latest, args: "", rust-targets: "" }
          # The oldest Ubuntu runners, so the Linux builds run on older distributions too.
          - { name: linux-x64, os: ubuntu-22.04, args: "", rust-targets: "" }
          - { name: linux-arm64, os: ubuntu-22.04-arm, args: "", rust-targets: "" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = push ]; then v="${GITHUB_REF_NAME#v}"; else v="${{ inputs.version }}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # The bundles take their version from Cargo.toml; --version shows TCGBINDER_VERSION.
          sed -i.bak "s/^version = \".*\"/version = \"$v\"/" Cargo.toml && rm Cargo.toml.bak
          echo "TCGBINDER_VERSION=$v" >> "$GITHUB_ENV"

      - name: Install Tauri's Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf file

      - name: Build
        run: |
          bundles=""
          # Windows Installer (MSI) versions must be plain numbers: pre-releases get the
          # NSIS installer only.
          if [ "${{ runner.os }}" = Windows ] && [[ "${{ steps.version.outputs.version }}" == *-* ]]; then bundles="--bundles nsis"; fi
          npx --yes @tauri-apps/cli@2 build ${{ matrix.args }} $bundles

      - name: Collect the installers
        run: |
          mkdir -p out
          find target -path '*/release/bundle/*' -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec cp {} out/ \;
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: tcgbinder-${{ steps.version.outputs.version }}-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" \
            --title "TCG Binder ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag $prerelease
